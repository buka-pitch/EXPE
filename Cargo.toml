[workspace]
resolver = "2"
members = [
    "crates/expe-core",
    "crates/expe-engine",
    "crates/expe-tui",
    "crates/expe-cli",
    "crates/expe-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["EXPE contributors"]
repository = "https://github.com/buka-pitch/EXPE"
description = "Safe binary triage: structure parsing, strings, IOC extraction and risk heuristics."

[workspace.dependencies]
expe-core = { path = "crates/expe-core" }
expe-engine = { path = "crates/expe-engine" }
expe-tui = { path = "crates/expe-tui" }
expe-testkit = { path = "crates/expe-testkit" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
goblin = "0.10"
memchr = "2.7"
regex = "1.11"
url = "2.5"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
time = { version = "0.3", features = ["formatting"] }
rayon = "1.11"
ratatui = { version = "0.30", features = ["crossterm"] }

clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
