# EXPE default IOC rule pack.
# Regexes are TOML literal strings: backslashes are preserved verbatim.
# The regex crate is linear-time; avoid look-around (unsupported by design).

ruleset_version = "1.0.0"

[[rules]]
id = "ioc.ipv4"
kind = "ipv4"
severity = "info"
confidence = "medium"
validator = "ipv4"
regex = '''(?i)\b(?:\d{1,3}\.){3}\d{1,3}\b'''
tags = ["network"]

[[rules]]
id = "ioc.ipv6"
kind = "ipv6"
severity = "info"
confidence = "medium"
validator = "ipv6"
regex = '''(?i)\b(?:[0-9a-f]{0,4}:){2,7}[0-9a-f]{0,4}\b'''
tags = ["network"]

[[rules]]
id = "ioc.domain"
kind = "domain"
severity = "info"
confidence = "medium"
validator = "domain"
regex = '''(?i)\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:com|net|org|io|co|ru|cn|su|info|biz|top|xyz|site|online|club|tk|pw|cc|ws|me|dev|app|cloud|link|live|shop|store|fun|icu|monster|quest|rest|bar|cam|cyou|sbs|cfd|bond|click|download|stream|gdn|life|world|today|space|website|tech|pro|mobi|asia|name|travel|gov|edu|mil|int|onion|bazar|locker|win|bid|loan|men|date|faith|review|party|science|work|trade|wiki|blog|page|news|art|design|agency|solutions|services|systems|software|network|digital|media|group|company|finance|bank|exchange|markets|money|credit|insurance|legal|health|care|clinic|school|university|academy|education|institute|foundation|community|social|family|home|food|restaurant|cafe|hotels|tickets|events|video|music|movie|deals|sale|market|buy|rent|properties|realestate|security|hosting|email|marketing|web|press|reviews|tools|supply|shipping|logistics|transport|airline|energy|solar|green|eco|beauty|spa|fitness|pharma|medical|tax|accounting|banking|loans|invest|crypto|wallet|token|blockchain|data|analytics|api|devops|code|git|build|deploy|server|host|vps|cdn|proxy|vpn|dns|mail|ftp|ssh|backup|storage|file|share|sync|chat|sms|call|meeting|course|quiz|weather|maps|hotel|booking|order|support|help|contact|privacy|terms|forum|profile|account|login|status|dashboard|admin|portal|gateway|hub|node|service|event|job|task|script|agent|process|system|driver|update|install|config|path|pipe|socket|port|lock|log|trace|metric|report|incident|malware|payload|exploit|patch|time|clock|timer|rate|limit|balance|master|leader|channel|message|summary|vector|windows|linux|android|ios|example|local|internal|test)\b'''
tags = ["network"]

[[rules]]
id = "ioc.url"
kind = "url"
severity = "info"
confidence = "high"
validator = "url"
regex = '''(?i)\b(?:https?|ftp)://[^\s"'<>]{4,2048}'''
tags = ["network"]

[[rules]]
id = "ioc.email"
kind = "email"
severity = "info"
confidence = "medium"
validator = "email"
regex = '''(?i)\b[a-z0-9._%+\-]+@(?:[a-z0-9-]+\.)+[a-z]{2,24}\b'''
tags = ["contact"]

[[rules]]
id = "ioc.registry_key"
kind = "registry_key"
severity = "info"
confidence = "medium"
validator = "generic"
regex = '''(?i)\b(?:HKEY_(?:LOCAL_MACHINE|CURRENT_USER|CLASSES_ROOT|USERS|CURRENT_CONFIG)|HKLM|HKCU|HKCR|HKU|HKCC)\\[^\s"'<>|]{2,260}'''
tags = ["windows"]

[[rules]]
id = "ioc.windows_path"
kind = "windows_path"
severity = "info"
confidence = "low"
validator = "path"
regex = '''(?i)(?:\b[A-Z]:\\|%[A-Z_]+%\\)(?:[^\\/:*?"<>|\r\n]+\\)*[^\\/:*?"<>|\r\n]+'''
tags = ["filesystem"]

[[rules]]
id = "ioc.unix_path"
kind = "unix_path"
severity = "info"
confidence = "low"
validator = "path"
regex = '''(?:^|[\s"'(])(/(?:etc|tmp|var|usr|home|root|opt|dev/shm|bin|sbin|lib|proc|sys|run|srv|mnt|media)/[A-Za-z0-9._\-/]{2,200})'''
tags = ["filesystem"]

[[rules]]
id = "ioc.mutex"
kind = "mutex"
severity = "info"
confidence = "low"
validator = "generic"
regex = '''(?i)\b(?:Global|Local)\\[^\s"'<>]{3,100}'''
tags = ["windows"]

[[rules]]
id = "ioc.named_pipe"
kind = "named_pipe"
severity = "info"
confidence = "medium"
validator = "generic"
regex = '''\\\\\.\\pipe\\[^\s"'<>]{1,200}'''
tags = ["windows", "ipc"]

[[rules]]
id = "ioc.pdb_path"
kind = "pdb_path"
severity = "info"
confidence = "high"
validator = "path"
regex = '''(?i)(?:[A-Z]:\\[^\r\n"'<>]*?\.pdb|[\w.-]+\.pdb)\b'''
tags = ["build", "leak"]

[[rules]]
id = "ioc.bitcoin"
kind = "bitcoin_address"
severity = "info"
confidence = "medium"
validator = "bitcoin"
regex = '''\b(?:bc1[a-z0-9]{25,62}|[13][a-km-zA-HJ-NP-Z1-9]{25,34})\b'''
tags = ["crypto"]

[[rules]]
id = "ioc.ethereum"
kind = "ethereum_address"
severity = "info"
confidence = "medium"
validator = "ethereum"
regex = '''\b0x[a-fA-F0-9]{40}\b'''
tags = ["crypto"]

[[rules]]
id = "ioc.onion"
kind = "onion_address"
severity = "info"
confidence = "high"
validator = "onion"
regex = '''\b[a-z2-7]{56}\.onion\b'''
tags = ["network", "tor"]
